name: Build apps

# Runs on every push to main (so breakage is caught early) and on every tag
# starting with "v", which additionally publishes a release with the files
# attached. Also runnable by hand from the Actions tab.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one platform failing should not hide the others
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            arch: ""
            artifact: Hapax-Finder-Windows
          - os: macos-14         # Apple silicon runner (macos-15 also works)
            label: macOS (Apple Silicon)
            arch: arm64
            artifact: Hapax-Finder-macOS-AppleSilicon
          # macos-13 was retired on 4 December 2025; macos-15-intel is the
          # replacement x86_64 label. Asking for a label that no longer exists
          # makes the job queue forever rather than fail, so it is worth
          # checking this one when a build never starts.
          - os: macos-15-intel   # Intel runner
            label: macOS (Intel)
            arch: x86_64
            artifact: Hapax-Finder-macOS-Intel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check it runs from source
        run: python run.py --selftest

      - name: Build
        env:
          HAPAX_TARGET_ARCH: ${{ matrix.arch }}
        run: pyinstaller chidon_hapax.spec --noconfirm

      # The important gate: prove the packaged app actually works before it is
      # published. Catches a data file that failed to make it into the bundle,
      # which otherwise only surfaces on someone else's machine.
      - name: Check the packaged app (Windows)
        if: runner.os == 'Windows'
        run: '& "dist/Hapax Finder/Hapax Finder.exe" --selftest'

      - name: Check the packaged app (macOS)
        if: runner.os == 'macOS'
        run: '"dist/Hapax Finder.app/Contents/MacOS/Hapax Finder" --selftest'

      - name: Confirm the architecture is what we asked for
        if: runner.os == 'macOS'
        run: |
          file "dist/Hapax Finder.app/Contents/MacOS/Hapax Finder"
          file "dist/Hapax Finder.app/Contents/MacOS/Hapax Finder" | grep -q "${{ matrix.arch }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "dist/Hapax Finder" `
                           -DestinationPath "Hapax Finder (Windows).zip"

      - name: Install create-dmg
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Package (macOS disk image)
        if: runner.os == 'macOS'
        run: |
          NAME="Hapax Finder (${{ matrix.arch == 'arm64' && 'Apple Silicon' || 'Intel' }})"
          # create-dmg drives Finder through AppleScript to arrange the window
          # and store the layout in the image. That occasionally fails on a CI
          # runner with no logged-in session, so fall back to a plain image
          # rather than failing the build over decoration.
          create-dmg \
            --volname "Hapax Finder" \
            --volicon "chidon_hapax/icons/app.icns" \
            --background "packaging/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "Hapax Finder.app" 150 200 \
            --hide-extension "Hapax Finder.app" \
            --app-drop-link 450 200 \
            --no-internet-enable \
            "$NAME.dmg" "dist/Hapax Finder.app" \
          || {
            echo "::warning::create-dmg failed; building a plain disk image"
            rm -f "$NAME.dmg"
            mkdir -p dmg
            cp -R "dist/Hapax Finder.app" dmg/
            ln -s /Applications dmg/Applications
            hdiutil create -volname "Hapax Finder" -srcfolder dmg \
                           -ov -format UDZO "$NAME.dmg"
          }
          ls -la *.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.zip
            *.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write           # needed to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
      - name: Show what will be published
        run: find files -type f | sort
      # Uploaded one at a time with retries rather than by
      # softprops/action-gh-release, which uploads all three concurrently:
      # GitHub's asset endpoint answered one of those with an HTML error page,
      # which failed the whole job after fifteen minutes.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          # reuse the release for this tag if one already exists, so a retry
          # after a failed run does not trip over itself
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --generate-notes \
              --title "$TAG"
          fi

          mapfile -d '' assets < <(
            find files -type f \( -name '*.dmg' -o -name '*.zip' \) -print0
          )

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets were found"
            exit 1
          fi

          for asset in "${assets[@]}"; do
            echo "Uploading: $asset"
            uploaded=false
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$asset" --clobber; then
                uploaded=true
                break
              fi
              echo "::warning::Upload failed for '$asset' (attempt $attempt/5)"
              sleep $((attempt * 15))
            done
            if [ "$uploaded" != true ]; then
              echo "::error::Unable to upload '$asset' after 5 attempts"
              exit 1
            fi
          done
