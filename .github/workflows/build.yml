name: Build apps

# Runs on every push to main (so breakage is caught early) and on every tag
# starting with "v", which additionally publishes a release with the files
# attached. Also runnable by hand from the Actions tab.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one platform failing should not hide the others
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            arch: ""
            artifact: Hapax-Finder-Windows
          - os: macos-14         # Apple silicon runner (macos-15 also works)
            label: macOS (Apple Silicon)
            arch: arm64
            artifact: Hapax-Finder-macOS-AppleSilicon
          # macos-13 was retired on 4 December 2025; macos-15-intel is the
          # replacement x86_64 label. Asking for a label that no longer exists
          # makes the job queue forever rather than fail, so it is worth
          # checking this one when a build never starts.
          - os: macos-15-intel   # Intel runner
            label: macOS (Intel)
            arch: x86_64
            artifact: Hapax-Finder-macOS-Intel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check it runs from source
        run: python run.py --selftest

      - name: Build
        env:
          HAPAX_TARGET_ARCH: ${{ matrix.arch }}
        run: pyinstaller chidon_hapax.spec --noconfirm

      # The important gate: prove the packaged app actually works before it is
      # published. Catches a data file that failed to make it into the bundle,
      # which otherwise only surfaces on someone else's machine.
      - name: Check the packaged app (Windows)
        if: runner.os == 'Windows'
        run: '& "dist/Hapax Finder/Hapax Finder.exe" --selftest'

      - name: Check the packaged app (macOS)
        if: runner.os == 'macOS'
        run: '"dist/Hapax Finder.app/Contents/MacOS/Hapax Finder" --selftest'

      - name: Confirm the architecture is what we asked for
        if: runner.os == 'macOS'
        run: |
          file "dist/Hapax Finder.app/Contents/MacOS/Hapax Finder"
          file "dist/Hapax Finder.app/Contents/MacOS/Hapax Finder" | grep -q "${{ matrix.arch }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "dist/Hapax Finder" `
                           -DestinationPath "Hapax Finder (Windows).zip"

      - name: Package (macOS disk image)
        if: runner.os == 'macOS'
        run: |
          NAME="Hapax Finder (${{ matrix.arch == 'arm64' && 'Apple Silicon' || 'Intel' }})"
          mkdir -p dmg
          cp -R "dist/Hapax Finder.app" dmg/
          ln -s /Applications dmg/Applications     # the drag-to-install target
          hdiutil create -volname "Hapax Finder" -srcfolder dmg \
                         -ov -format UDZO "$NAME.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.zip
            *.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write           # needed to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
      - name: Show what will be published
        run: find files -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: files/**/*
          draft: true           # review before anyone can download it
          generate_release_notes: true
